<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Val d'Ambre</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0b10;
        overflow: hidden;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        color: #f4ecd8;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: none;
        cursor: default;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        letter-spacing: 0.2em;
        font-size: 13px;
        color: #c8b28a;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="boot">CHARGEMENT…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
